[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-governance-lab"
version = "1.0.0"
description = "Multi-account AWS governance policies and offline security response exercises"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["boto3>=1.43.115,<2", "jsonschema>=4.26,<5"]

[project.scripts]
governance-lab = "governance_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
governance_lab = ["data/*.json", "policies/*.tftpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
