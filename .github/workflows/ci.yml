name: Validate governance lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-build-isolation --no-deps
      - name: Initialise provider schemas without AWS credentials
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for stack in organization log-archive account-baseline; do
            terraform -chdir="infra/$stack" init -backend=false -input=false -lockfile=readonly
          done
      - name: Validate Python, Terraform and fictional exercises
        run: python scripts/verify.py
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict --disable-pip --no-deps
      - name: Test the installed wheel
        run: |
          python -m pip uninstall -y aws-governance-lab
          python -m pip install dist/*.whl --no-deps
          cd "$RUNNER_TEMP"
          governance-lab demo --output "$GITHUB_WORKSPACE/reports/wheel-demo"
      - name: Upload offline validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-validation-python-${{ matrix.python }}
          path: |
            reports/
            coverage.xml
            dist/
          retention-days: 14
          if-no-files-found: warn
